<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JWT Authentication Demo — Modern auth with React & Node.js" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      :root {
        --bg:   #03030a;
        --s1:   #0c0c18;
        --s2:   #111122;
        --s3:   #18182e;
        --b1:   rgba(255,255,255,0.06);
        --b2:   rgba(255,255,255,0.10);
        --b3:   rgba(255,255,255,0.18);
        --a:    #7c6af7;
        --a2:   #9d8fff;
        --a3:   #c4b8ff;
        --ag:   rgba(124,106,247,0.14);
        --ag2:  rgba(124,106,247,0.28);
        --t1:   #f0ecff;
        --t2:   #8d88ba;
        --t3:   #45426a;
        --ok:   #0fd49c;
        --okg:  rgba(15,212,156,0.13);
        --err:  #ff5c5c;
        --errg: rgba(255,92,92,0.12);
        --warn: #f5a94e;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html { font-size: 15px; scroll-behavior: smooth; }

      body {
        background: var(--bg);
        color: var(--t1);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        line-height: 1.6;
      }

      /* ─── Keyframes ─── */
      @keyframes spin        { to { transform: rotate(360deg); } }
      @keyframes fade-up     { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fade-in     { from { opacity:0; } to { opacity:1; } }
      @keyframes dot-bounce  { 0%,80%,100% { transform:scale(0.4); opacity:0.3; } 40% { transform:scale(1); opacity:1; } }
      @keyframes glow-pulse  { 0%,100% { opacity:0.5; transform:scale(1); } 50% { opacity:0.85; transform:scale(1.12); } }
      @keyframes slide-in    { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }

      .afu  { animation: fade-up 0.5s cubic-bezier(.22,1,.36,1) both; }
      .afu1 { animation: fade-up 0.5s 0.07s cubic-bezier(.22,1,.36,1) both; }
      .afu2 { animation: fade-up 0.5s 0.14s cubic-bezier(.22,1,.36,1) both; }
      .afu3 { animation: fade-up 0.5s 0.21s cubic-bezier(.22,1,.36,1) both; }
      .afu4 { animation: fade-up 0.5s 0.28s cubic-bezier(.22,1,.36,1) both; }
      .afu5 { animation: fade-up 0.5s 0.35s cubic-bezier(.22,1,.36,1) both; }
      .afi  { animation: fade-in 0.4s ease both; }

      /* ─── Spinner ─── */
      .spin {
        display: inline-block;
        border-radius: 50%;
        border: 2px solid var(--b2);
        border-top-color: var(--a);
        border-right-color: var(--a2);
        animation: spin 0.65s linear infinite;
        flex-shrink: 0;
      }
      .spin-md { width: 40px; height: 40px; border-width: 3px; }
      .spin-sm { width: 18px; height: 18px; }
      .spin-lg { width: 56px; height: 56px; border-width: 4px; }

      /* ─── Dots loader ─── */
      .dots { display: flex; gap: 5px; align-items: center; }
      .dots span {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--a);
        animation: dot-bounce 1.3s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.18s; }
      .dots span:nth-child(3) { animation-delay: 0.36s; }

      /* ─── Card ─── */
      .card {
        background: var(--s1);
        border: 1px solid var(--b1);
        border-radius: 18px;
        transition: border-color 0.25s, transform 0.25s cubic-bezier(.22,1,.36,1), box-shadow 0.25s;
      }
      .card:hover {
        border-color: var(--b2);
        transform: translateY(-3px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 0 1px var(--b1);
      }
      .card-flat {
        background: var(--s1);
        border: 1px solid var(--b1);
        border-radius: 18px;
      }
      .card-inner {
        background: var(--s2);
        border: 1px solid var(--b1);
        border-radius: 12px;
      }

      /* ─── Buttons ─── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 0.01em;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        transition: all 0.2s cubic-bezier(.22,1,.36,1);
        position: relative;
        overflow: hidden;
      }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

      .btn-primary {
        background: var(--a);
        color: #fff;
        padding: 11px 22px;
        box-shadow: 0 4px 20px rgba(124,106,247,0.25);
      }
      .btn-primary:hover {
        background: var(--a2);
        box-shadow: 0 6px 28px rgba(124,106,247,0.42);
        transform: translateY(-1px);
      }
      .btn-primary:active { transform: translateY(0); box-shadow: 0 2px 10px rgba(124,106,247,0.3); }

      .btn-ghost {
        background: var(--b1);
        color: var(--t2);
        padding: 10px 18px;
        border: 1px solid var(--b1);
      }
      .btn-ghost:hover { background: var(--b2); color: var(--t1); border-color: var(--b2); }

      .btn-outline {
        background: transparent;
        color: var(--t1);
        padding: 10px 18px;
        border: 1px solid var(--b2);
      }
      .btn-outline:hover { background: var(--b1); border-color: var(--b3); }

      .btn-danger {
        background: var(--errg);
        color: var(--err);
        padding: 9px 16px;
        border: 1px solid rgba(255,92,92,0.2);
      }
      .btn-danger:hover { background: rgba(255,92,92,0.2); border-color: rgba(255,92,92,0.35); }

      .btn-ok {
        background: var(--okg);
        color: var(--ok);
        padding: 9px 16px;
        border: 1px solid rgba(15,212,156,0.2);
      }
      .btn-ok:hover { background: rgba(15,212,156,0.2); }

      .btn-sm  { padding: 7px 14px;  font-size: 0.8rem;  border-radius: 8px; }
      .btn-lg  { padding: 14px 28px; font-size: 1rem;    border-radius: 12px; }
      .btn-xl  { padding: 16px 32px; font-size: 1.05rem; border-radius: 14px; }
      .btn-full { width: 100%; }

      /* ─── Input ─── */
      .inp {
        width: 100%;
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--b2);
        border-radius: 10px;
        color: var(--t1);
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 500;
        padding: 12px 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .inp::placeholder { color: var(--t3); font-weight: 400; }
      .inp:hover:not(:focus) { border-color: var(--b3); }
      .inp:focus { border-color: var(--a); box-shadow: 0 0 0 3px var(--ag); }

      /* ─── Label ─── */
      .lbl {
        display: block;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--t2);
        margin-bottom: 7px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* ─── Badge ─── */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.74rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 99px;
        letter-spacing: 0.03em;
      }
      .badge-a   { background: var(--ag);  color: var(--a2); }
      .badge-ok  { background: var(--okg); color: var(--ok); }
      .badge-err { background: var(--errg);color: var(--err); }
      .badge-dim { background: var(--b1);  color: var(--t2); }

      /* ─── Alert ─── */
      .alert {
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 0.88rem;
        font-weight: 500;
        line-height: 1.55;
      }
      .alert-err { background: var(--errg); border: 1px solid rgba(255,92,92,0.22); color: var(--err); }
      .alert-ok  { background: var(--okg);  border: 1px solid rgba(15,212,156,0.22);color: var(--ok); }
      .alert-warn { background: rgba(245,169,78,0.12); border: 1px solid rgba(245,169,78,0.2); color: var(--warn); }

      /* ─── Divider ─── */
      .divider { height: 1px; background: var(--b1); }

      /* ─── Gradient text ─── */
      .grad {
        background: linear-gradient(135deg, var(--a3) 0%, var(--a) 45%, #b78bfa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ─── Nav ─── */
      .nav-glass {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(3,3,10,0.82);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--b1);
      }

      /* ─── Avatar ─── */
      .avatar { border-radius: 50%; object-fit: cover; flex-shrink: 0; }
      .avatar-placeholder {
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        flex-shrink: 0;
        background: linear-gradient(135deg, var(--a) 0%, #b78bfa 100%);
        color: #fff;
        letter-spacing: -0.02em;
      }

      /* ─── Orb (background glow) ─── */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
        animation: glow-pulse 5s ease-in-out infinite;
      }

      /* ─── Page wrapper ─── */
      .page { padding: 48px 24px; max-width: 1100px; margin: 0 auto; }
      .page-narrow { padding: 64px 24px; max-width: 460px; margin: 0 auto; }
      .page-center { min-height: calc(100vh - 62px); display: flex; align-items: center; justify-content: center; padding: 24px; }

      /* ─── Link ─── */
      .link { color: var(--a2); text-decoration: none; font-weight: 600; transition: color 0.15s; }
      .link:hover { color: var(--a3); }

      /* ─── Scrollbar ─── */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--b2); }
    </style>
    <title>JWT Auth — Demo Skeleton</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
